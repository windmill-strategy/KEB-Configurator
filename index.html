<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Product Selector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.3.4/vue.global.prod.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0C0D10;--surface:#15171C;--surface-2:#1C1F26;--surface-3:#24282F;
  --border:#2A2E37;--border-hover:#3A3F4A;--border-active:#4A90D9;
  --text-1:#E8EAED;--text-2:#9AA0AB;--text-3:#5F6672;
  --accent:#4A90D9;--accent-dim:rgba(74,144,217,.10);--accent-mid:rgba(74,144,217,.22);
  --green:#34D399;--green-dim:rgba(52,211,153,.10);
  --amber:#FBBF24;--amber-dim:rgba(251,191,36,.10);
  --red:#F87171;--red-dim:rgba(248,113,113,.10);
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',-apple-system,sans-serif;
  --radius:8px;--radius-lg:12px;--transition:.18s ease;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text-1);min-height:100vh;-webkit-font-smoothing:antialiased}
.app-wrapper{max-width:1200px;margin:0 auto;padding:24px 20px 100px}
.app-header{display:flex;align-items:center;gap:12px;margin-bottom:32px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.app-logo{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:14px;color:#fff;flex-shrink:0}
.app-title{font-size:18px;font-weight:600;letter-spacing:-.02em}
.app-title span{color:var(--text-3);font-weight:400;margin-left:6px}
.main-grid{display:grid;grid-template-columns:1fr 340px;gap:28px;align-items:start}
@media(max-width:860px){.main-grid{grid-template-columns:1fr}.side-panel{display:none}}
.main-col{min-width:0}
.progress{margin-bottom:28px}
.progress-track{display:flex;gap:3px;margin-bottom:8px}
.progress-seg{flex:1;height:3px;background:var(--surface-3);border-radius:3px;transition:background .3s ease;overflow:hidden;position:relative}
.progress-seg.done{background:var(--accent)}
.progress-seg.active::after{content:'';position:absolute;left:0;top:0;bottom:0;width:50%;background:var(--accent);border-radius:3px;animation:ppulse 1.8s ease-in-out infinite}
@keyframes ppulse{0%,100%{opacity:.5}50%{opacity:1}}
.progress-meta{display:flex;justify-content:space-between;align-items:center}
.progress-label{font-size:11px;font-weight:500;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.match-badge{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:4px}
.match-badge.ok{color:var(--green);background:var(--green-dim)}
.match-badge.warn{color:var(--amber);background:var(--amber-dim)}
.match-badge.danger{color:var(--red);background:var(--red-dim)}
.step-num{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--accent);letter-spacing:.04em;margin-bottom:4px}
.step-title{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.2;margin-bottom:4px}
.step-desc{font-size:13px;color:var(--text-2);line-height:1.5;margin-bottom:20px}
.options{display:flex;flex-direction:column;gap:5px;margin-bottom:24px}
.opt{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:12px 14px;cursor:pointer;transition:all var(--transition);display:flex;align-items:center;gap:11px;user-select:none}
.opt:hover{border-color:var(--border-hover);background:var(--surface-2)}
.opt.sel{border-color:var(--accent);background:var(--accent-dim)}
.opt.only{border-color:var(--accent);background:var(--accent-dim);cursor:default}
.opt-radio{width:16px;height:16px;min-width:16px;border-radius:50%;border:2px solid var(--border);transition:all var(--transition);display:flex;align-items:center;justify-content:center}
.opt.sel .opt-radio,.opt.only .opt-radio{border-color:var(--accent);background:var(--accent)}
.opt-radio::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--bg);opacity:0;transition:opacity var(--transition)}
.opt.sel .opt-radio::after,.opt.only .opt-radio::after{opacity:1}
.opt-label{font-size:13px;font-weight:500}
.single-note{font-size:11px;color:var(--text-3);margin-bottom:14px;font-style:italic}

/* TYPE CARDS (F6/S6) */
.type-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:24px}
.type-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;transition:all var(--transition);cursor:pointer}
.type-card:hover{border-color:var(--border-hover);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.type-card.unavailable{opacity:.35;pointer-events:none}
.type-card-label{text-align:center;padding:12px 12px 8px;font-size:16px;font-weight:700;letter-spacing:.02em;color:var(--text-1)}
.type-card-img{width:100%;aspect-ratio:3/4;object-fit:contain;background:var(--surface-2);padding:8px}
.type-card-select{padding:10px}
.type-card-select button{width:100%;padding:10px 12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--transition)}
.type-card-select button:hover{background:#5A9DE6;box-shadow:0 4px 12px rgba(74,144,217,.3)}

/* CONTROL BOARD CARDS */
.ctrl-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:24px}
@media(max-width:600px){.ctrl-cards{grid-template-columns:repeat(2,1fr)}.type-cards{grid-template-columns:1fr}}
.ctrl-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;display:flex;flex-direction:column;transition:all var(--transition)}
.ctrl-card:hover{border-color:var(--border-hover);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.ctrl-card.unavailable{opacity:.35;pointer-events:none}
.ctrl-tier{text-align:center;padding:8px 8px 4px;font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em}
.ctrl-badge{text-align:center;padding:5px 8px;margin:0 10px 8px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.02em}
.ctrl-badge.compact{background:#1a8a8a;color:#b8f0f0}
.ctrl-badge.application{background:#8a7a1a;color:#f0e8b8}
.ctrl-badge.pro{background:#8a1a3a;color:#f0b8c8}
.ctrl-rows{flex:1;padding:0 10px}
.ctrl-row{padding:7px 0;border-bottom:1px solid var(--border);font-size:10px;color:var(--text-2);line-height:1.45}
.ctrl-row:last-child{border-bottom:none}
.ctrl-row-label{font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-bottom:2px}
.ctrl-row-val{font-size:11px;color:var(--text-1);font-weight:500}
.ctrl-select{padding:10px;margin-top:auto}
.ctrl-select button{width:100%;padding:9px 12px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;transition:all var(--transition)}
.ctrl-select button:hover{background:#5A9DE6;box-shadow:0 4px 12px rgba(74,144,217,.3)}

.unit-row{display:flex;gap:5px;margin-bottom:14px}
.unit-btn{font-family:var(--mono);font-size:12px;font-weight:500;padding:7px 18px;border-radius:var(--radius);border:1.5px solid var(--border);background:var(--surface);color:var(--text-2);cursor:pointer;transition:all var(--transition)}
.unit-btn:hover{border-color:var(--accent);color:var(--text-1)}
.unit-btn.on{border-color:var(--accent);background:var(--accent-dim);color:var(--accent)}

.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.btn{font-family:var(--sans);font-size:13px;font-weight:600;border:none;border-radius:var(--radius);padding:10px 22px;cursor:pointer;transition:all var(--transition)}
.btn:disabled{opacity:.3;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--text-3);padding:10px 12px}
.btn-ghost:hover:not(:disabled){color:var(--text-1)}
.btn-primary{background:var(--accent);color:#fff;margin-left:auto}
.btn-primary:hover:not(:disabled){background:#5A9DE6;box-shadow:0 4px 16px rgba(74,144,217,.3)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text-2);display:inline-flex;align-items:center;gap:6px}
.btn-outline:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}

.side-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow-y:auto}
.side-panel h2{font-size:16px;font-weight:700;margin-bottom:12px;letter-spacing:-.02em;color:var(--text-1)}
.side-panel h3{font-size:13px;font-weight:600;margin-top:16px;margin-bottom:6px;color:var(--accent)}
.side-panel p{font-size:13px;line-height:1.65;color:var(--text-2);margin-bottom:10px}
.side-panel strong{color:var(--text-1);font-weight:600}
.side-panel ul,.side-panel ol{font-size:13px;color:var(--text-2);padding-left:18px;margin-bottom:10px;line-height:1.6}
.side-panel .shimmer{display:flex;flex-direction:column;gap:10px;padding:4px 0}
.side-panel .shimmer-line{height:12px;background:var(--surface-3);border-radius:4px;animation:shimmer 1.2s ease-in-out infinite alternate}
.side-panel .shimmer-line.w70{width:70%}.side-panel .shimmer-line.w100{width:100%}
.side-panel .shimmer-line.w85{width:85%}.side-panel .shimmer-line.w50{width:50%}
.side-panel .shimmer-line.h18{height:18px;margin-bottom:4px}
.side-panel .shimmer-line:nth-child(2){animation-delay:.1s}
.side-panel .shimmer-line:nth-child(3){animation-delay:.2s}
.side-panel .shimmer-line:nth-child(4){animation-delay:.3s}
.side-panel .shimmer-line:nth-child(5){animation-delay:.4s}
@keyframes shimmer{from{opacity:.4}to{opacity:.7}}

.result-wrap{animation:slideUp .35s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.result-header{margin-bottom:24px}
.result-header h2{font-size:20px;font-weight:700;letter-spacing:-.03em;margin-bottom:2px}
.result-header p{font-size:13px;color:var(--text-2)}
.sku-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:8px;cursor:pointer;transition:all var(--transition)}
.sku-card:hover{border-color:var(--border-hover)}.sku-card.exp{border-color:var(--accent)}
.sku-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.sku-num{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.sku-toggle{font-size:11px;color:var(--text-3);display:flex;align-items:center;gap:4px}
.sku-toggle svg{width:14px;height:14px;transition:transform .2s ease}
.sku-card.exp .sku-toggle svg{transform:rotate(180deg)}
.specs-grid{padding:0 18px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px}
.spec{background:var(--surface-2);border-radius:6px;padding:9px 11px}
.spec-k{font-size:9px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:1px}
.spec-v{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--text-1)}
.actions-bar{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.summary-box{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:18px;margin-top:20px}
.summary-box h3{font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px}
@media(max-width:600px){.summary-grid{grid-template-columns:1fr}}
.s-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--border)}
.s-row:last-child{border-bottom:none}
.s-key{font-size:12px;color:var(--text-2)}.s-val{font-size:12px;font-weight:600;font-family:var(--mono)}
.step-file-placeholder{background:var(--surface);border:1.5px dashed var(--border);border-radius:var(--radius-lg);padding:28px;text-align:center;margin-top:20px}
.step-file-placeholder svg{width:48px;height:48px;color:var(--text-3);margin-bottom:10px}
.step-file-placeholder h4{font-size:14px;font-weight:600;margin-bottom:4px}
.step-file-placeholder p{font-size:12px;color:var(--text-3)}
.contact-section{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-top:20px}
.contact-section h3{font-size:14px;font-weight:600;margin-bottom:4px}
.contact-section .sub{font-size:12px;color:var(--text-3);margin-bottom:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:11px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em}
.form-group input{background:var(--surface-2);border:1.5px solid var(--border);border-radius:var(--radius);padding:9px 12px;font-family:var(--sans);font-size:13px;color:var(--text-1);outline:none;transition:border var(--transition)}
.form-group input:focus{border-color:var(--accent)}
.form-group input::placeholder{color:var(--text-3)}
.form-submit{margin-top:14px;display:flex;justify-content:flex-end;align-items:center;gap:12px}
.submit-msg{font-size:12px;color:var(--green)}
.no-match{text-align:center;padding:40px 20px}
.no-match h3{font-size:18px;font-weight:700;margin-bottom:6px}
.no-match p{color:var(--text-2);font-size:13px;line-height:1.6}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:100px 20px;color:var(--text-3);font-size:13px;gap:14px}
.spinner{width:22px;height:22px;border:2.5px solid var(--surface-3);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.upload-overlay{position:fixed;inset:0;background:rgba(12,13,16,.95);display:flex;align-items:center;justify-content:center;z-index:9999;text-align:center}
.upload-box{max-width:400px}
.upload-box h2{font-size:20px;font-weight:700;margin-bottom:8px}
.upload-box p{font-size:13px;color:var(--text-2);margin-bottom:20px}
.upload-box label{display:inline-block;padding:11px 26px;background:var(--accent);color:#fff;border-radius:var(--radius);cursor:pointer;font-weight:600;font-size:13px}
.upload-box input{display:none}
.fade-enter-active{animation:fadeIn .22s ease-out}
.fade-leave-active{animation:fadeIn .12s ease-in reverse}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="app">
<div class="app-wrapper">
  <div class="app-header">
    <div class="app-logo">PS</div>
    <div class="app-title">Product Selector<span>v2.1</span></div>
  </div>

  <div v-if="state==='loading'" class="loading"><div class="spinner"></div><span>Loading product data…</span></div>

  <div v-if="state==='upload'" class="upload-overlay">
    <div class="upload-box">
      <h2>Load Product Data</h2>
      <p>Drop your CSV file here or click to browse.</p>
      <label>Choose CSV File<input type="file" accept=".csv" @change="handleFileUpload" /></label>
    </div>
  </div>

  <!-- ===== ACTIVE FORM ===== -->
  <template v-if="state==='active'">
    <div class="main-grid">
      <div class="main-col">
        <div class="progress">
          <div class="progress-track">
            <div v-for="(s,i) in steps" :key="i" class="progress-seg" :class="{done:i<idx,active:i===idx}"></div>
          </div>
          <div class="progress-meta">
            <span class="progress-label">Step {{idx+1}} of {{steps.length}}</span>
            <span class="match-badge" :class="matchClass">{{matchCount}} match{{matchCount!==1?'es':''}}</span>
          </div>
        </div>

        <transition name="fade" mode="out-in">
          <div :key="idx">
            <div class="step-num">STEP {{idx+1}}</div>
            <div class="step-title">{{cur.label}}</div>
            <div v-if="cur.desc" class="step-desc">{{cur.desc}}</div>

            <!-- ===== VOLTAGE STEP (IEC/UL toggle) ===== -->
            <template v-if="cur.id==='voltage'">
              <div class="unit-row">
                <button v-for="u in ['IEC','UL']" :key="u" class="unit-btn" :class="{on:voltStd===u}" @click="switchVoltStd(u)">{{u}}</button>
              </div>
              <div v-if="opts.length===1" class="single-note">Only one option available — auto-selected.</div>
              <div class="options">
                <div v-for="o in opts" :key="o" class="opt" :class="{sel:sels[cur.id]===o,only:opts.length===1}" @click="pick(cur.id,o)">
                  <div class="opt-radio"></div>
                  <div class="opt-label">{{o}}</div>
                </div>
              </div>
            </template>

            <!-- ===== POWER STEP (kW/Hp toggle) ===== -->
            <template v-else-if="cur.id==='power'">
              <div class="unit-row">
                <button v-for="u in powerUnits" :key="u.key" class="unit-btn" :class="{on:powerUnit===u.key}" @click="switchPowerUnit(u.key)">{{u.display}}</button>
              </div>
              <div v-if="opts.length===1" class="single-note">Only one option available — auto-selected.</div>
              <div class="options">
                <div v-for="o in opts" :key="o" class="opt" :class="{sel:sels[cur.id]===o,only:opts.length===1}" @click="pick(cur.id,o)">
                  <div class="opt-radio"></div>
                  <div class="opt-label">{{o}} {{powerUnits.find(u=>u.key===powerUnit).display}}</div>
                </div>
              </div>
            </template>

            <!-- ===== TYPE STEP (F6/S6 image cards) ===== -->
            <template v-else-if="cur.id==='type'">
              <div class="type-cards">
                <div v-for="tc in typeCardsFiltered" :key="tc.key" class="type-card" :class="{unavailable:!tc.available}">
                  <div class="type-card-label">{{tc.label}}</div>
                  <img :src="tc.img" :alt="tc.label" class="type-card-img" />
                  <div class="type-card-select">
                    <button @click.stop="pickType(tc.key)">Select {{tc.key}}</button>
                  </div>
                </div>
              </div>
            </template>

            <!-- ===== CONTROL BOARD CARDS ===== -->
            <template v-else-if="cur.id==='control'">
              <div class="ctrl-cards">
                <div v-for="card in ctrlCardsFiltered" :key="card.key" class="ctrl-card" :class="{unavailable:!card.available}">
                  <div class="ctrl-tier">{{card.tier}}</div>
                  <div class="ctrl-badge" :class="card.badgeClass">{{card.badge}}</div>
                  <div class="ctrl-rows">
                    <div class="ctrl-row"><div class="ctrl-row-label">Safety Function</div><div class="ctrl-row-val">{{card.safety}}</div></div>
                    <div class="ctrl-row"><div class="ctrl-row-label">Safety Protocol</div><div class="ctrl-row-val">{{card.protocol}}</div></div>
                    <div class="ctrl-row"><div class="ctrl-row-label">Fieldbus</div><div class="ctrl-row-val">{{card.fieldbus}}</div></div>
                    <div class="ctrl-row"><div class="ctrl-row-label">Encoder</div><div class="ctrl-row-val">{{card.encoder}}</div></div>
                  </div>
                  <div class="ctrl-select"><button @click.stop="pickControl(card.key)">Select {{card.key}}</button></div>
                </div>
              </div>
            </template>

            <!-- ===== DEFAULT OPTIONS (all other steps) ===== -->
            <template v-else>
              <div v-if="opts.length===1" class="single-note">Only one option available — auto-selected.</div>
              <div class="options">
                <div v-for="o in opts" :key="o" class="opt" :class="{sel:sels[cur.id]===o,only:opts.length===1}" @click="pick(cur.id,o)">
                  <div class="opt-radio"></div>
                  <div class="opt-label">{{o}}</div>
                </div>
              </div>
            </template>

            <div class="nav">
              <button class="btn btn-ghost" :disabled="idx===0" @click="back">← Back</button>
              <button class="btn btn-primary" :disabled="!canNext" @click="next">{{isLast?'Show Results':'Next →'}}</button>
            </div>
          </div>
        </transition>
      </div>

      <div class="side-panel">
        <div v-if="sideLoading" class="shimmer">
          <div class="shimmer-line h18 w70"></div><div class="shimmer-line w100"></div>
          <div class="shimmer-line w85"></div><div class="shimmer-line w100"></div><div class="shimmer-line w50"></div>
        </div>
        <div v-else v-html="sideHtml"></div>
      </div>
    </div>
  </template>

  <!-- ===== RESULTS ===== -->
  <template v-if="state==='results'">
    <div class="main-grid">
      <div class="main-col">
        <div class="result-wrap">
          <div class="result-header">

                  <div class="spec-v">{{p[sc]||'—'}}</div>

              </div>
            </div>
          </div>

            </div>
          </div>

              <div class="form-group"><label>Name</label><input v-model="contact.name" placeholder="Your full name" /></div>
              <div class="form-group"><label>Company</label><input v-model="contact.company" placeholder="Company name" /></div>
              <div class="form-group"><label>Email</label><input v-model="contact.email" type="email" placeholder="you@company.com" /></div>
              <div class="form-group"><label>Phone</label><input v-model="contact.phone" type="tel" placeholder="+1 (555) 123-4567" /></div>

          </div>

          </div>
        </div>

'water-cooled-push-through-mount': '## Water Cooled — Push-Through Mount\n\nLiquid cooling with external coolant connections.\n\n### When to Choose\n\nMaximum thermal performance with separation between electrical and fluid.',
'water-cooled-panel-mount-high-perf': '## Water Cooled — Panel Mount (High Performance)\n\nOptimized coolant channels for maximum heat extraction.\n\n### When to Choose\n\nFull-load operation at maximum switching frequency.',
'water-cooled-push-through-mount-high-perf': '## Water Cooled — Push-Through (High Performance)\n\nTop-tier thermal configuration.\n\n### When to Choose\n\nThe most demanding applications.',
};

function heatsinkSlug(opt){
  return opt.toLowerCase().replace(/[()]/g,'').replace(/\s*\/\s*/g,'-').replace(/\s+/g,'-').replace(/-+/g,'-');
}

// ================================================================
createApp({
  setup(){
    const state = ref('loading');
    const allProducts = ref([]);
    const idx = ref(0);
    const sels = ref({});
    const voltStd = ref('IEC');
    const powerUnit = ref('KW');
    const powerUnits = [{key:'KW',display:'kW'},{key:'HP',display:'Hp'}];
    const expSku = ref(0);
    const sideHtml = ref('');
    const sideLoading = ref(false);
    const contentCache = {};
    const formSent = ref(false);
    const contact = ref({name:'',company:'',email:'',phone:''});

    // ---- STEPS (no safety step) ----
    const steps = [
      {id:'voltage',  label:'Select Voltage',                desc:'Choose your voltage standard (IEC or UL), then select the input voltage.'},
      {id:'power',    label:'Select Power Rating',            desc:'Choose a unit first, then select a power rating.'},
      {id:'type',     label:'Select Type',                    desc:'Choose the drive platform.'},
      {id:'emi',      label:'Select EMI Option',              desc:'Select the electromagnetic interference filter configuration.'},
      {id:'heatsink', label:'Select Heatsink',                desc:'Select the cooling and mounting configuration.'},
      {id:'overload', label:'Select Overload Characteristic', desc:'Select the rated switching frequency.'},
      {id:'control',  label:'Select Control Board',           desc:'Select the control and communication interface.'},
    ];

    const voltColMap = {IEC:'Voltage_IEC', UL:'Voltage_UL'};
    const powerColMap = {KW:'Power_KW', HP:'Power_HP'};

    const specCols = ['Type','Heatsink','Voltage_IEC','Voltage_UL','EMI',
      'Power_KW','Power_HP','Irated_IEC_A','Irated_UL_A',
      'I_OC_A','I_OL_A','I_OC_%','I_OL_%',
      'Rated_kHz','Max_kHz','Ctrl_Board'];

    // ---- FILTERING ----
    function filterTo(n){
      let p = allProducts.value;
      for(let i=0;i<n;i++){
        const s=steps[i], v=sels.value[s.id];
        if(v==null) continue;
        if(s.id==='voltage'){
          p=p.filter(r=>String(r[voltColMap[voltStd.value]])===String(v));
        } else if(s.id==='power'){
          p=p.filter(r=>String(r[powerColMap[powerUnit.value]])===String(v));
        } else if(s.id==='heatsink'){
          p=p.filter(r=>String(r.Heatsink)===String(v));
        } else if(s.id==='type'){
          p=p.filter(r=>String(r.Type)===String(v));
        } else if(s.id==='emi'){
          p=p.filter(r=>String(r.EMI)===String(v));
        } else if(s.id==='overload'){
          p=p.filter(r=>String(r.Rated_kHz)===String(v));
        } else if(s.id==='control'){
          p=p.filter(r=>String(r.Ctrl_Board)===String(v));
        }
      }
      return p;
    }

    const filtered = computed(()=>filterTo(idx.value));
    const matchCount = computed(()=>filtered.value.length);
    const matchClass = computed(()=>matchCount.value<=5?'danger':matchCount.value<=20?'warn':'ok');
    const cur = computed(()=>steps[idx.value]);
    const isLast = computed(()=>idx.value===steps.length-1);
    const final = computed(()=>filterTo(steps.length));

    // ---- OPTIONS ----
    const opts = computed(()=>{
      const s=cur.value, pool=filtered.value;
      if(s.id==='voltage'){
        const col=voltColMap[voltStd.value];
        const v=[...new Set(pool.map(r=>String(r[col])))].filter(x=>x&&x!=='undefined');
        return v.sort();
      }
      if(s.id==='power'){
        const col=powerColMap[powerUnit.value];
        const v=[...new Set(pool.map(r=>r[col]))].filter(x=>x&&x!=='undefined');
        return v.sort((a,b)=>parseFloat(a)-parseFloat(b)).map(String);
      }
      if(s.id==='type'){
        const v=[...new Set(pool.map(r=>String(r.Type)))];
        return v.sort();
      }
      if(s.id==='emi'){
        const v=[...new Set(pool.map(r=>String(r.EMI)))];
        return v.sort();
      }
      if(s.id==='heatsink'){
        const v=[...new Set(pool.map(r=>String(r.Heatsink)))].filter(x=>x&&x!=='undefined');
        // Filter out oil options
        return v.filter(x=>!x.toLowerCase().includes('oil')).sort();
      }
      if(s.id==='overload'){
        const v=[...new Set(pool.map(r=>String(r.Rated_kHz)))].filter(x=>x&&x!=='undefined');
        return v.sort((a,b)=>parseFloat(a)-parseFloat(b));
      }
      if(s.id==='control'){
        const v=[...new Set(pool.map(r=>String(r.Ctrl_Board)))].filter(x=>x&&x!=='undefined');
        return v.sort();
      }
      return [];
    });

    // Auto-select single option
    watch(opts,(o)=>{
      const s=cur.value;
      if(o.length===1) sels.value[s.id]=o[0];
    },{flush:'post'});

    function pick(id,v){
      if(opts.value.length>1) sels.value[id]=v;
      if(id==='heatsink') nextTick(()=>loadSideContent());
    }

    // Type cards
    const typeCardsFiltered = computed(()=>{
      const available = new Set(opts.value);
      return Object.entries(TYPE_CARD_DATA).map(([key,data])=>({
        key, ...data, available: available.has(key)
      }));
    });
    function pickType(key){
      sels.value['type']=key;
      nextTick(()=>next());
    }

    // Control cards
    const ctrlCardsFiltered = computed(()=>{
      const available = new Set(opts.value);
      return Object.entries(CTRL_CARD_DATA).map(([key,data])=>({
        key, ...data, available: available.has(key)
      }));
    });
    function pickControl(key){
      sels.value['control']=key;
      nextTick(()=>next());
    }

    const canNext = computed(()=>sels.value[cur.value.id]!=null);

    function switchVoltStd(u){
      if(u===voltStd.value) return;
      delete sels.value['voltage'];
      voltStd.value=u;
    }
    function switchPowerUnit(u){
      if(u===powerUnit.value) return;
      delete sels.value['power'];
      powerUnit.value=u;
    }

    function next(){
      if(isLast.value){state.value='results';return;}
      idx.value++;
      nextTick(()=>{
        const o=opts.value, s=steps[idx.value];
        if(o.length===1) sels.value[s.id]=o[0];
        loadSideContent();
      });
    }
    function back(){
      if(idx.value>0){
        delete sels.value[steps[idx.value].id];
        idx.value--;
        loadSideContent();
      }
    }
    function backFromResults(){state.value='active';loadSideContent();}
    function restart(){idx.value=0;sels.value={};voltStd.value='IEC';powerUnit.value='KW';expSku.value=0;formSent.value=false;state.value='active';loadSideContent();}

    const doneSteps = computed(()=>steps.filter(s=>sels.value[s.id]!=null));
    function dispSel(s){
      const v=sels.value[s.id];
      if(s.id==='power'){
        const u = powerUnits.find(x=>x.key===powerUnit.value);
        return v+' '+(u?u.display:powerUnit.value);
      }
      if(s.id==='voltage') return v+' ('+voltStd.value+')';
      return v??'—';
    }
    function fmtLabel(c){return c.replace(/_/g,' ').replace(/%/g,'%');}

    // ---- SIDE PANEL ----
    async function fetchMd(path, fallback){
      if(contentCache[path]) return contentCache[path];
      try{
        const r=await fetch(path);
        if(r.ok){const t=await r.text();contentCache[path]=t;return t;}
      }catch(e){}
      contentCache[path]=fallback;
      return fallback;
    }
    async function preloadContent(){
      const stepFetches=steps.map(s=>fetchMd('content/step-'+s.id+'.md',STEP_CONTENT[s.id]||''));
      const hsSlugs=Object.keys(HEATSINK_CONTENT);
      const hsFetches=hsSlugs.map(slug=>fetchMd('content/heatsink-'+slug+'.md',HEATSINK_CONTENT[slug]||''));
      await Promise.allSettled([...stepFetches,...hsFetches]);
    }
    async function loadSideContent(){
      const id=steps[idx.value].id;
      if(id==='heatsink'&&sels.value.heatsink){
        const slug=heatsinkSlug(sels.value.heatsink);
        const path='content/heatsink-'+slug+'.md';
        if(contentCache[path]){sideHtml.value=marked.parse(contentCache[path]);return;}
        sideLoading.value=true;
        const md=await fetchMd(path,HEATSINK_CONTENT[slug]||STEP_CONTENT.heatsink||'');
        sideHtml.value=marked.parse(md);sideLoading.value=false;return;
      }
      const path='content/step-'+id+'.md';
      if(contentCache[path]){sideHtml.value=marked.parse(contentCache[path]);return;}
      sideLoading.value=true;
      const md=await fetchMd(path,STEP_CONTENT[id]||'');
      sideHtml.value=marked.parse(md);sideLoading.value=false;
    }

    // ---- PDF ----
    function downloadPdf(){
      const{jsPDF}=window.jspdf;
      const doc=new jsPDF();
      const product=final.value[expSku.value>=0&&expSku.value<final.value.length?expSku.value:0];
      if(!product) return;
      doc.setFontSize(20);doc.setTextColor(40,60,80);
      doc.text('Product Specification Sheet',14,22);
      doc.setFontSize(14);doc.setTextColor(74,144,217);
      doc.text(product.Part_Number||'—',14,34);
      doc.setFontSize(11);doc.setTextColor(60,60,60);
      doc.text('Configuration Summary',14,46);
      doc.autoTable({startY:50,head:[['Parameter','Selection']],body:doneSteps.value.map(s=>[s.label,dispSel(s)]),theme:'grid',headStyles:{fillColor:[74,144,217],fontSize:10},bodyStyles:{fontSize:10},margin:{left:14,right:14}});
      const specY=doc.lastAutoTable.finalY+12;
      doc.text('Technical Specifications',14,specY);
      doc.autoTable({startY:specY+4,head:[['Specification','Value']],body:specCols.map(c=>[fmtLabel(c),String(product[c]||'—')]),theme:'grid',headStyles:{fillColor:[74,144,217],fontSize:10},bodyStyles:{fontSize:10},margin:{left:14,right:14}});
      const fy=doc.lastAutoTable.finalY+10;
      doc.setFontSize(8);doc.setTextColor(150,150,150);
      doc.text('Generated by Product Selector — '+new Date().toLocaleDateString(),14,fy);
      doc.save((product.Part_Number||'product')+'-spec-sheet.pdf');
    }

    // ---- Contact ----
    const canSubmit=computed(()=>contact.value.name&&contact.value.email);
    function submitForm(){
      console.log('Contact submission:',JSON.stringify({...contact.value,selectedProduct:final.value[expSku.value>=0?expSku.value:0]?.Part_Number,selections:{...sels.value,voltStd:voltStd.value,powerUnit:powerUnit.value}}));
      formSent.value=true;
    }

    // ---- File upload ----
    function handleFileUpload(e){
      const file=e.target.files[0];if(!file) return;
      const reader=new FileReader();
      reader.onload=ev=>parseCSV(ev.target.result);
      reader.readAsText(file);
    }
    function parseCSV(text){
      const parsed=Papa.parse(text.trim(),{header:true,skipEmptyLines:true,dynamicTyping:false});
      allProducts.value=parsed.data;
      state.value='active';
      nextTick(()=>{
        const o=opts.value;
        if(o.length===1) sels.value[steps[0].id]=o[0];
        loadSideContent();
        preloadContent();
      });
    }

    // ---- Init ----
    onMounted(async()=>{
      let csv='';
      for(const name of ['data.csv','selector.csv','webselector.csv']){
        try{const r=await fetch(name);if(r.ok){csv=await r.text();break;}}catch(e){}
      }
      if(csv) parseCSV(csv);
      else state.value='upload';
    });

    return {
      state,steps,idx,sels,voltStd,powerUnit,powerUnits,expSku,sideHtml,sideLoading,contact,formSent,
      cur,opts,filtered,matchCount,matchClass,canNext,isLast,final,doneSteps,specCols,
      typeCardsFiltered,ctrlCardsFiltered,
      pick,pickType,pickControl,next,back,backFromResults,restart,
      switchVoltStd,switchPowerUnit,dispSel,fmtLabel,
      downloadPdf,canSubmit,submitForm,handleFileUpload,loadSideContent
    };
  }
}).mount('#app');
</script>
</body>
</html>
